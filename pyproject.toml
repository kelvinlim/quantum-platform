[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-platform"
version = "0.1.0"
description = "Quantum Platform capture sidecar (JSON-RPC 2.0 NDJSON) and experiment runner"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
authors = [{ name = "Kelvin O. Lim" }]
keywords = ["capture", "tauri", "sidecar", "experiment"]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
qp = "quantum_platform.cli:main"

[project.urls]
Repository = "https://github.com/kelvinlim/quantum-platform"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
