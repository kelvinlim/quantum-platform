[package]
name = "quantum-platform"
version = "0.1.0"
description = "Quantum Platform operator shell (Tauri 2 + Python sidecar)"
authors = ["Kelvin O. Lim"]
edition = "2021"

[lib]
name = "quantum_platform_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
which = "7"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
